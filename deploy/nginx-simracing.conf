# simracing.egorprotasov.ru на hq: сайт из /var/www/simracing, API — служба simracing-api на 127.0.0.1:8100.
# HTTPS дописывает certbot --nginx (блоки «managed by Certbot»).

# Запрос пишет историю в базу — ограничиваем частоту с одного адреса
limit_req_zone $binary_remote_addr zone=simracing_api:1m rate=30r/m;

server {
    server_name simracing.egorprotasov.ru;

    root /var/www/simracing;
    index index.html;
    error_page 404 /404.html;

    # Сайт закрыт от индексации: заголовок на всех ответах, robots.txt собирается с Disallow
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /api/ {
        limit_req zone=simracing_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100;
    }

    # Имена файлов сборки содержат хэш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/simracing.egorprotasov.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/simracing.egorprotasov.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = simracing.egorprotasov.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name simracing.egorprotasov.ru;
    return 404; # managed by Certbot


}